<style>

#cap{font-size:11px;max-width:210px}

}

<body>

const pal=['#ffd9a0','#fff4e8','#bcd0ff','#ffb48a','#ffffff'];
for(let i=0;i<3000*Q;i++)add(SUN.x+gauss()*.035,gauss()*.03,gauss()*.035,c1.set(pal[i%5]).clone(),.8+Math.random()*1.8);
add(SUN.x,SUN.y,SUN.z,c1.set('#fff2c8').clone(),10);
const rd=()=>new V3(gauss(),gauss(),gauss()).normalize();
for(let s=0;s<1100*Q;s++){const r=Math.pow(10,4.4+3.15*Math.pow(Math.random(),.8)),p=rd().multiplyScalar(r),d=rd(),st=r*.03,h=.6+Math.random()*.12;
 for(let k=0;k<36;k++){d.add(rd().multiplyScalar(.35)).normalize();p.addScaledVector(d,st);add(p.x+gauss()*st*.3,p.y+gauss()*st*.3,p.z+gauss()*st*.3,c1.setHSL(h,.55,.62).clone().multiplyScalar(.9),1+Math.random()*1.2)}}
for(let i=0;i<5000*Q;i++){const p=rd().multiplyScalar(4.65e7);add(p.x,p.y,p.z,c1.set('#ff7a35').clone().multiplyScalar(.5+Math.random()*.4),1.6)}
const named=[['Alpha Centauri',315,-1,4.37,6,'#ffe2b0'],['Sirius',227,-9,8.6,8,'#d6e4ff'],['Vega',67,19,25,8,'#cfe0ff'],['Arcturus',15,69,37,8,'#ffc58a'],['Polaris',123,27,433,8,'#fff2d0'],['Betelgeuse',199,-9,548,9,'#ff9a6a'],['Antares',352,15,550,9,'#ff8a60'],['Rigel',210,-25,860,9,'#bcd0ff'],['Deneb',84,2,2600,9,'#dfe8ff']];
named.forEach(n=>{const p=at(n[1],n[2],n[3]);add(p.x,p.y,p.z,c1.set(n[5]).clone(),n[4])});
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('col',new THREE.Float32BufferAttribute(C,3));g.setAttribute('sz',new THREE.Float32BufferAttribute(Z,1));

 vertexShader:'attribute vec3 col;attribute float sz;uniform float uT,uPR;varying vec3 vC;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;float ph=fract(sin(dot(position.xy,vec2(12.9898,78.233))+position.z)*43758.5453);gl_PointSize=sz*uPR*(1.+.18*sin(uT*2.+ph*40.));vC=col;}',

const gt=(()=>{const k=document.createElement('canvas');k.width=k.height=128;const x=k.getContext('2d'),r=x.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.3,'rgba(255,255,255,.35)');r.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=r;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(k)})();
const glows=[[O0,16,'#ffc27a',.9],[O0,75,'#7f95ff',.35],[A,140,'#b8c4ff',.5],[M33,45,'#c0d0ff',.35],[LMC,9,'#c8d4ff',.4],[SMC,5,'#c8d4ff',.3]].map(d=>{
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:gt,color:d[2],blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,transparent:true}));s.position.copy(d[0]);s.scale.setScalar(d[1]*2);s.userData={R:d[1],k:d[3]};S.add(s);return s});
const O=[];const lab=$('labels');
let auto=true,prog=0,foc=null;
function obj(name,p,lo,hi,view,note){const e=document.createElement('div');e.className='l';e.textContent=name;e.tabIndex=0;e.setAttribute('role','button');e.setAttribute('aria-label','Explore '+name);e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();stop();fly(o)}});const o={name,p,lo,hi,view,note,e};e.onclick=()=>{stop();fly(o)};lab.appendChild(e);O.push(o);return o}
const sunO=obj('You are here: Earth',SUN,.003,40,.006,'The only world known to host life. Sunlight takes 8 minutes and 20 seconds to reach Earth.');
foc=sunO;
const notes={'Alpha Centauri':'The closest star system to the Sun. Light from here takes just over four years to reach us.','Sirius':'The brightest star in our night sky, twice as massive as the Sun.','Vega':'A bright blue-white star that was once the pole star and will be again.','Arcturus':'An aging orange giant racing through the galaxy against the flow of most stars.','Polaris':'The North Star. A pulsing supergiant that barely moves in our sky.','Betelgeuse':'A red supergiant so large that, placed where the Sun is, it would swallow the orbits of Mars and Jupiter.','Antares':'A red supergiant, the heart of the Scorpion.','Rigel':'A blue supergiant about 120,000 times brighter than the Sun.','Deneb':'One of the most luminous stars known, shining from thousands of light-years away.'};
named.forEach(n=>obj(n[0],at(n[1],n[2],n[3]),n[3]<20?.0015:n[3]<100?.004:n[3]/1000*.4,Math.max(n[3]/1000*25,.1),n[3]/1000*2.4+.003,notes[n[0]]));
obj('Sagittarius A*',O0,2,220,3,'A supermassive black hole with about four million times the mass of the Sun, at the heart of the Milky Way.');
['Perseus Arm','Orion Arm','Sagittarius Arm','Scutum–Centaurus Arm'].forEach((n,k)=>{const a=k*Math.PI/2+40/50*9;obj(n,new V3(40*Math.cos(a),0,40*Math.sin(a)),8,350,45,k==1?'The spiral arm that holds the Sun, a spur of stars and gas between two grander arms.':'A great curve of young stars, gas and dust spiralling around the galactic centre.')});

obj('The Cosmic Web',at(20,-40,2.2e9),3e5,5e7,8e6,'Galaxies trace giant filaments around enormous voids, the largest structure of the universe.');

const tgt=SUN.clone();

function fmt(n){const u=n<1e3?['',1]:n<1e6?['thousand',1e3]:n<1e9?['million',1e6]:['billion',1e9];const v=n/u[1];return (v<10?v.toFixed(1):Math.round(v).toLocaleString('en'))+(u[0]?' '+u[0]:'')}
