<html lang="en">

<title>Solar System Explorer · Cosmic Pioneer</title>
<style>
:root{--void:#04050a;--ink:#e8ebf5;--dim:#8b93aa;--acc:#ffc27a;--glass:rgba(12,15,28,.58);--line:rgba(255,255,255,.1);color-scheme:dark;

#cap{font-size:11px;max-width:210px}

</style>
